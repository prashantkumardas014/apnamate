name: Keep Render Backend Warm

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            https://apnamate-backend-2026.onrender.com/health)
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Backend did not return 200"
            exit 0
          fi
          echo "✅ Backend is warm"
