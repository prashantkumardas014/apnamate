name: Keep Render Backend Warm

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging at $(date)"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            https://apnamate-backend-2026.onrender.com/health

      - name: Keep this workflow alive
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
